# Copy to the VPS as ~/castle-dot-dev/compose.yml, next to .env with
# PROXY_NETWORK=<docker network of the front Caddy>.
services:
  site:
    image: ghcr.io/castlele/castle-dot-dev:latest
    container_name: castledot_site
    restart: unless-stopped
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
